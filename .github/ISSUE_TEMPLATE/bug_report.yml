name: Bug report
description: Something failed while installing or using Prompt Picker.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: The version shown in Settings. Windows is 1.1.1. The web app is 1.2.0.
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: For example Windows 11 24H2.
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, and what happened instead.
      placeholder: Installed to C:\Prompt Picker, opened the Desktop shortcut, then...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste the relevant lines from %APPDATA%\Prompt Picker\startup.log and %APPDATA%\Prompt Picker\crash.log. Do not include prompt text.
    validations:
      required: false
